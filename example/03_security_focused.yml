# ============================================================
# CONFIG 3: SECURITY FOCUSED - Threat detection
# ============================================================
# Tests: ipgeolocation_ip_security + ipgeolocation_ip_geolocation
#        with a mix of clean, proxy, VPN, Tor, and bot IPs.
# Use case: Enrich firewall/CDN logs with threat intelligence.
# Credits: ~30 (2 credits/IP for security + 3 credits/IP for geo+security)
# Plan: PAID
# ============================================================
kind: source
spec:
  name: ipgeolocation
  registry: grpc
  path: "localhost:7777"
  tables:
    - "ipgeolocation_ip_geolocation"
    - "ipgeolocation_ip_security"
  destinations: ["sqlite"]
  spec:
    api_key: ""

    ips:
      # Clean IPs
      - "8.8.8.8"            # Google DNS - should be clean
      - "1.1.1.1"            # Cloudflare - should be clean

      # Known VPN/proxy IPs (high threat score expected)
      - "2.56.188.34"        # Known proxy + VPN
      - "185.220.101.1"      # Tor exit node (common)

      # Cloud provider IPs
      - "13.107.42.14"       # Microsoft Azure
      - "35.186.224.47"      # Google Cloud

      # Residential / ISP
      - "91.128.103.196"     # Tele2 Sweden (residential ISP)

    # Include security data inside the geolocation response too.
    include_security: true
    include_abuse: false

    rate_limit: 5
---
kind: destination
spec:
  name: sqlite
  path: cloudquery/sqlite
  version: "v2.9.3"
  spec:
    connection_string: "./ipgeo_security.db"

