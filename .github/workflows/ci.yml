name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.10', '1.27.3']
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
      - name: Verify modules
        run: go mod verify
      - name: Test with race detection
        run: go test -race -count=1 -timeout=5m ./...
      - name: Test legacy HTTP/2 transport with race detection
        run: go test -race -tags=http2legacy -count=1 -timeout=5m ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux binary
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/cq-source-ipgeolocation" ./
      - name: Check for reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
